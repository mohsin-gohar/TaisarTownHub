# G-15 — SPA + prerendered-route static serving.
#
# try_files falls back to the per-route HTML file first (built by
# scripts/prerender.mts, e.g. /reset-password → reset-password.html), then to
# the SPA shell. Private documents are NEVER served from here — they live on
# the API's private disk.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ---- Phase 12: security headers + Content Security Policy -------------
    # The frontend is a static SPA: it must never be framed, must only run its
    # own scripts, and may only talk to the API over the configured origins.
    # Private agency documents are served by the API, never from here.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https: http://127.0.0.1:8090; media-src 'self' blob: data: https:; frame-src 'self' https://www.google.com; worker-src 'self' blob:; manifest-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Long cache for content-hashed bundles; short revalidate for everything else.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Content-Type "application/manifest+json";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html /index.html;
    }

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }
}
