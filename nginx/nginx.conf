# TaisarTownHub Production — Nginx Reverse Proxy with SSL Termination
# Terminates HTTPS, proxies to frontend and backend services

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Docker's embedded DNS resolves a service name to every running replica.
    # Resolving at request time (see the variable proxy_pass below) means
    # `docker compose up --scale backend=N` is picked up without a reload.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream frontend {
        server frontend:80;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_register:10m rate=3r/m;
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=60r/m;

    # Security headers applied globally
    map $request_uri $security_headers {
        default 1;
    }

    # ------------------------------------------------------------
    # 80 -> 443 redirect
    # ------------------------------------------------------------
    server {
        listen 80;
        server_name taisartownhub.com www.taisartownhub.com api.taisartownhub.com;
        return 301 https://$host$request_uri;
    }

    # ------------------------------------------------------------
    # 443 — Public frontend (SPA)
    # ------------------------------------------------------------
    server {
        listen 443 ssl http2;
        server_name taisartownhub.com www.taisartownhub.com;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header Referrer-Policy strict-origin-when-cross-origin;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()";
        add_header Cross-Origin-Opener-Policy same-origin;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Content Security Policy (Phase 12): the SPA may only run its own
        # scripts and talk to the API origin - no inline script, no framing.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://api.taisartownhub.com; media-src 'self' blob: data: https:; frame-src 'self' https://www.google.com; worker-src 'self' blob:; manifest-src 'self'" always;

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ------------------------------------------------------------
    # 443 — API backend
    # ------------------------------------------------------------
    server {
        listen 443 ssl http2;
        server_name api.taisartownhub.com;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header Referrer-Policy strict-origin-when-cross-origin;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()";
        add_header Cross-Origin-Opener-Policy same-origin;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # The API answers with JSON, media and downloadable files - it must
        # never render or execute anything.
        add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; script-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; sandbox" always;

        # If every replica fails, return a small JSON error instead of Nginx's
        # HTML error page so API clients can degrade gracefully.
        error_page 502 503 504 = @api_unavailable;

        # CORS preflight
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Origin, Content-Type, Accept, Authorization, X-Agency-Id, X-Requested-With' always;
            add_header Access-Control-Max-Age 3600;
            add_header Content-Type 'text/plain charset=UTF-8';
            add_header Content-Length 0;
            return 204;
        }

        # Rate limit login/register
        location = /api/auth/login {
            limit_req zone=api_login burst=2 nodelay;
            set $api_upstream "backend:8080";
            proxy_pass http://$api_upstream$request_uri;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Agency-Id $http_x_agency_id;
        }

        location = /api/auth/register {
            limit_req zone=api_register burst=1 nodelay;
            set $api_upstream "backend:8080";
            proxy_pass http://$api_upstream$request_uri;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Agency-Id $http_x_agency_id;
        }

        location /api/ {
            limit_req zone=api_general burst=20 nodelay;
            set $api_upstream "backend:8080";
            proxy_pass http://$api_upstream$request_uri;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Agency-Id $http_x_agency_id;
        }

        location @api_unavailable {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 503 '{"status":"degraded","error":"API temporarily unavailable"}';
        }
    }
}
