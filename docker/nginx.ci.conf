# CI-only nginx gateway.
#
# Mounted over the production config by docker-compose.ci.yml via `nginx -c`.
# CI runners have no TLS certificates (`nginx/ssl/` is intentionally empty),
# so this file mirrors production ROUTING but serves plain HTTP on :80:
#
#   /storage/* -> shared public disk (read-only volume)
#   /api/*     -> PHP-FPM on backend:9000 (same fastcgi params as production)
#   /healthz   -> container readiness probe
#   everything else -> the frontend SPA container
#
# This keeps production's HTTPS config untouched while letting CI exercise the
# real gateway, real PHP-FPM and real frontend build end to end.

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Documents (25MB) and map images (10MB) must reach PHP intact.
    client_max_body_size 50m;

    # Trust only the disposable CI Docker bridge when resolving the test
    # client's X-Forwarded-For. This lets per-role TEST-NET addresses exercise
    # the real rate-limit zones without weakening production nginx.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Docker DNS: resolve backend replicas at request time, exactly as in
    # production, so a restarted replica does not leave a stale FPM address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream frontend {
        server frontend:80;
    }

    limit_req_zone $binary_remote_addr zone=api_login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_register:10m rate=3r/m;
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=60r/m;

    # Signal rate limiting correctly to API clients (rather than service unavailable).
    limit_req_status 429;

    # Mirror production's origin allowlist for CORS preflight.
    map $http_origin $tth_cors_origin {
        default "";
        "~^http://localhost(:[0-9]+)?$" $http_origin;
        "~^http://127\.0\.0\.1(:[0-9]+)?$" $http_origin;
        "~^https://(www\.)?taisartownhub\.com$" $http_origin;
        "~^https://api\.taisartownhub\.com$" $http_origin;
    }

    server {
        listen 80;
        server_name _;

        # Target of the Compose healthcheck for this service.
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'ok';
        }

        # Map images and public media from the shared volume.
        location /storage/ {
            alias /var/www/storage/public/;
            autoindex off;
            expires 7d;
        }

        error_page 502 503 504 = @api_unavailable;

        # CORS preflight (parity with production).
        #
        # `add_header` is NOT valid in a server-level `if`; nginx exits with
        # "add_header" directive is not allowed here, so the gateway never
        # starts and the readiness gate times out. The internal redirect sends
        # OPTIONS to a named location, where add_header is allowed.
        error_page 418 = @cors_preflight;
        if ($request_method = 'OPTIONS') {
            return 418;
        }

        location @cors_preflight {
            add_header Access-Control-Allow-Origin $tth_cors_origin always;
            add_header Vary Origin always;
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Origin, Content-Type, Accept, Authorization, X-Agency-Id, X-Requested-With' always;
            add_header Access-Control-Max-Age 3600;
            return 204;
        }

        location = /api/auth/login {
            limit_req zone=api_login burst=2 nodelay;
            set $api_upstream "backend:9000";
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param DOCUMENT_ROOT /var/www/html/public;
            fastcgi_param HTTP_HOST $host;
            fastcgi_param HTTP_X_REAL_IP $remote_addr;
            fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
            fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
            fastcgi_param HTTP_X_FORWARDED_HOST $host;
            fastcgi_param HTTP_X_AGENCY_ID $http_x_agency_id;
            fastcgi_param HTTP_X_REQUEST_ID $http_x_request_id;
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_pass $api_upstream;
            # Never replay non-idempotent requests after a 500.
            fastcgi_next_upstream error timeout invalid_header http_503;
            fastcgi_next_upstream_tries 3;
            fastcgi_connect_timeout 5s;
            fastcgi_send_timeout 90s;
            fastcgi_read_timeout 90s;
        }

        location = /api/auth/register {
            limit_req zone=api_register burst=1 nodelay;
            set $api_upstream "backend:9000";
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param DOCUMENT_ROOT /var/www/html/public;
            fastcgi_param HTTP_HOST $host;
            fastcgi_param HTTP_X_REAL_IP $remote_addr;
            fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
            fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
            fastcgi_param HTTP_X_FORWARDED_HOST $host;
            fastcgi_param HTTP_X_AGENCY_ID $http_x_agency_id;
            fastcgi_param HTTP_X_REQUEST_ID $http_x_request_id;
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_pass $api_upstream;
            # Never replay non-idempotent requests after a 500.
            fastcgi_next_upstream error timeout invalid_header http_503;
            fastcgi_next_upstream_tries 3;
            fastcgi_connect_timeout 5s;
            fastcgi_send_timeout 90s;
            fastcgi_read_timeout 90s;
        }

        location /api/ {
            limit_req zone=api_general burst=20 nodelay;
            set $api_upstream "backend:9000";
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param DOCUMENT_ROOT /var/www/html/public;
            fastcgi_param HTTP_HOST $host;
            fastcgi_param HTTP_X_REAL_IP $remote_addr;
            fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
            fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
            fastcgi_param HTTP_X_FORWARDED_HOST $host;
            fastcgi_param HTTP_X_AGENCY_ID $http_x_agency_id;
            fastcgi_param HTTP_X_REQUEST_ID $http_x_request_id;
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_pass $api_upstream;
            # Never replay non-idempotent requests after a 500.
            fastcgi_next_upstream error timeout invalid_header http_503;
            fastcgi_next_upstream_tries 3;
            fastcgi_connect_timeout 5s;
            fastcgi_send_timeout 90s;
            fastcgi_read_timeout 90s;
        }

        location @api_unavailable {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 503 '{"status":"degraded","error":"API temporarily unavailable"}';
        }

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
