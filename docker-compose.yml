# TaisarTownHub Enterprise — Production Docker Setup
# Usage:
#   docker compose up -d          # Start all services
#   docker compose down           # Stop all services
#   docker compose logs -f        # View logs
#
# Services: mysql, redis, clamav, backend, frontend, nginx, worker
#
# Build contexts match the per-service Dockerfiles:
#   backend/Dockerfile.prod   (context ./backend)
#   frontend/Dockerfile.prod  (context ./frontend)
#
# Secrets are NEVER baked into images: APP_KEY, DB passwords and API keys are
# supplied as runtime environment variables (see .env / deployment runbook).

services:
  # ------------------------------------------------------------
  # 1. MySQL 8.4 — Production database for multi-tenant SaaS
  # ------------------------------------------------------------
  mysql:
    image: mysql:8.4
    container_name: taisartownhub-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_DATABASE:-taisartownhub}
      MYSQL_USER: ${DB_USERNAME:-taisar}
      MYSQL_PASSWORD: ${DB_PASSWORD:-taisar}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - taisartownhub-network

  # ------------------------------------------------------------
  # 2. Redis — Caching, queues & rate limiting
  # ------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: taisartownhub-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispassword} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - taisartownhub-network

  # ------------------------------------------------------------
  # 3. ClamAV — malware scanner for uploaded documents
  #    The API talks to the daemon over the INSTREAM protocol
  #    (CLAMD_SOCKET=clamav:3310). Uploads fail closed when the
  #    scanner is unreachable.
  # ------------------------------------------------------------
  clamav:
    image: clamav/clamav:1.4
    container_name: taisartownhub-clamav
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - taisartownhub-network

  # ------------------------------------------------------------
  # 4. Laravel Backend (API + Sanctum)
  # ------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: taisartownhub-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: https://api.taisartownhub.com
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-taisartownhub}
      DB_USERNAME: ${DB_USERNAME:-taisar}
      DB_PASSWORD: ${DB_PASSWORD:-taisar}
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword}
      CORS_ALLOWED_ORIGINS: https://taisartownhub.com,https://www.taisartownhub.com
      SANCTUM_STATEFUL_DOMAINS: taisartownhub.com,www.taisartownhub.com
      STRIPE_KEY: ${STRIPE_KEY}
      STRIPE_SECRET: ${STRIPE_SECRET}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      FLUTTERWAVE_PUBLIC_KEY: ${FLUTTERWAVE_PUBLIC_KEY}
      FLUTTERWAVE_SECRET_KEY: ${FLUTTERWAVE_SECRET_KEY}
      FLUTTERWAVE_ENCRYPTION_KEY: ${FLUTTERWAVE_ENCRYPTION_KEY}
      FLUTTERWAVE_WEBHOOK_SECRET: ${FLUTTERWAVE_WEBHOOK_SECRET}
      SENTRY_DSN: ${SENTRY_DSN}
      LOGROCKET_APP_ID: ${LOGROCKET_APP_ID}
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@taisartownhub.com}
      # Malware scanning — real ClamAV daemon (see the `clamav` service).
      # Fail closed: an upload is rejected when no scan could be performed.
      MALWARE_SCAN_ENABLED: "true"
      MALWARE_SCANNER: clamav
      CLAMD_SOCKET: clamav:3310
      CLAMD_TIMEOUT: "30"
      MALWARE_SCAN_FAIL_CLOSED: "true"
      MALWARE_SCAN_LOG_SKIPPED: "true"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    networks:
      - taisartownhub-network
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8080"]

  # ------------------------------------------------------------
  # 5. Frontend — React 19 + Vite (production build served via Nginx)
  # ------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: https://api.taisartownhub.com/api
        VITE_APP_MODE: production
        VITE_STRIPE_PUBLIC_KEY: ${STRIPE_KEY}
        VITE_SENTRY_DSN: ${SENTRY_DSN}
        VITE_GA_MEASUREMENT_ID: ${GA_MEASUREMENT_ID}
        VITE_LOGROCKET_APP_ID: ${LOGROCKET_APP_ID}
    container_name: taisartownhub-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - taisartownhub-network

  # ------------------------------------------------------------
  # 6. Nginx — Reverse proxy, SSL termination, load balancing
  # ------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: taisartownhub-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - taisartownhub-network

  # ------------------------------------------------------------
  # 7. Worker — Queue processing (payments, emails, reports)
  #    The entrypoint honours the command below and does NOT run
  #    migrations on worker restarts (RUN_MIGRATIONS=false).
  # ------------------------------------------------------------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: taisartownhub-worker
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-taisartownhub}
      DB_USERNAME: ${DB_USERNAME:-taisar}
      DB_PASSWORD: ${DB_PASSWORD:-taisar}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword}
      QUEUE_CONNECTION: redis
      RUN_MIGRATIONS: "false"
      MALWARE_SCAN_ENABLED: "true"
      MALWARE_SCANNER: clamav
      CLAMD_SOCKET: clamav:3310
      CLAMD_TIMEOUT: "30"
      MALWARE_SCAN_FAIL_CLOSED: "true"
      MALWARE_SCAN_LOG_SKIPPED: "true"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90"]
    networks:
      - taisartownhub-network

networks:
  taisartownhub-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  clamav_data:
