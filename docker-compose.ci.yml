# TaisarTownHub — CI Docker Compose
# Test-specific overrides with safe defaults for CI environment.
# Usage: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d
#
# Notes:
#   * GitHub Actions jobs run on separate runners, so images built in the
#     backend/frontend jobs are NOT present in the integration job. That job
#     rebuilds both tags with the shared GHA cache and starts the stack with
#     `--no-build`, so Compose reuses the tested images instead of silently
#     building extra copies.
#   * DB_DATABASE must match the database created by the CI MySQL service;
#     otherwise migrations and the container test suite target a missing DB.
#   * The MySQL healthcheck runs a real TCP query as the app user, because
#     `mysqladmin ping -h localhost` can pass before the init scripts create
#     that user/database (the entrypoint's temporary server listens on a
#     socket). Without it the `migrate` one-shot could fail on first boot.
#   * CI has no TLS certificates, so nginx is started with a HTTP-only config.

services:
  mysql:
    environment:
      MYSQL_ROOT_PASSWORD: test-root-password
      MYSQL_DATABASE: taisartownhub_test
      MYSQL_USER: taisar
      MYSQL_PASSWORD: test-password
    # `mysqladmin ping -h localhost` succeeds against the init-time server
    # (socket-only, before MYSQL_DATABASE/MYSQL_USER exist), so Compose could
    # mark MySQL healthy while the app credentials were still missing. A real
    # TCP query as the app user proves the database is usable by the services
    # that depend on it and removes the first-run race that made the migrate
    # one-shot fail intermittently.
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=TCP -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" -e 'SELECT 1' \"$$MYSQL_DATABASE\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    command: redis-server --requirepass test-redis-password --appendonly yes

  clamav:
    # Use a lighter clamav config for CI
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 120s

  migrate:
    image: taisartownhub-backend:test
    environment:
      APP_KEY: base64:FCkLXSSnmmfbGJwJic1ie3qcv8XYDzm78f9Ax91nIGM=
      DB_DATABASE: taisartownhub_test
      DB_PASSWORD: test-password
      REDIS_PASSWORD: test-redis-password

  backend:
    image: taisartownhub-backend:test
    environment:
      # Disposable integration stack only: seed demo personas and trust the
      # private Docker bridge so Playwright can use isolated TEST-NET IP buckets.
      APP_ENV: testing
      # High limits only for disposable browser-audit CI; production defaults remain strict.
      API_PUBLIC_RATE_LIMIT: "10000"
      API_AUTH_RATE_LIMIT: "120"
      API_WRITE_RATE_LIMIT: "1200"
      API_FALLBACK_RATE_LIMIT: "10000"
      API_FALLBACK_AUTH_RATE_LIMIT: "1200"
      TRUSTED_PROXIES: 172.16.0.0/12,127.0.0.1,::1
      APP_KEY: base64:FCkLXSSnmmfbGJwJic1ie3qcv8XYDzm78f9Ax91nIGM=
      APP_URL: http://localhost
      DB_DATABASE: taisartownhub_test
      DB_PASSWORD: test-password
      REDIS_PASSWORD: test-redis-password
      CORS_ALLOWED_ORIGINS: http://localhost,http://127.0.0.1
      SANCTUM_STATEFUL_DOMAINS: localhost
      # Test keys (safe for CI)
      STRIPE_KEY: sk_test_ci
      STRIPE_SECRET: sk_test_ci
      STRIPE_WEBHOOK_SECRET: whsec_test
      FLUTTERWAVE_PUBLIC_KEY: FLWPUBK_TEST
      FLUTTERWAVE_SECRET_KEY: FLWSECK_TEST
      FLUTTERWAVE_ENCRYPTION_KEY: FLWENC_TEST
      FLUTTERWAVE_WEBHOOK_SECRET: whsec_test
      MAIL_MAILER: log
      MAIL_HOST: localhost
      MAIL_PORT: 1025
      MAIL_USERNAME: test
      MAIL_PASSWORD: test
      MAIL_FROM_ADDRESS: test@localhost
      SENTRY_DSN:
      LOGROCKET_APP_ID:
      # Disable malware scanning in CI for speed
      MALWARE_SCAN_ENABLED: "false"
      MALWARE_SCAN_FAIL_CLOSED: "false"
    healthcheck:
      test: ["CMD", "php", "scripts/healthcheck.php"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    image: taisartownhub-frontend:test
    build:
      args:
        VITE_API_URL: http://127.0.0.1/api
        VITE_STRIPE_PUBLIC_KEY: pk_test_ci
        VITE_GOOGLE_OAUTH_ENABLED: "false"
        VITE_SENTRY_DSN:
        VITE_GA_MEASUREMENT_ID:
        VITE_LOGROCKET_APP_ID:

  nginx:
    # Production config requires TLS certificates, which CI does not have.
    # `-c` selects the HTTP-only config; the production mount stays harmless.
    command: ["nginx", "-g", "daemon off;", "-c", "/etc/nginx/nginx.ci.conf"]
    volumes:
      - ./docker/nginx.ci.conf:/etc/nginx/nginx.ci.conf:ro

  # Exercises the exact production readiness command with disposable CI
  # infrastructure, while keeping the full-stack browser stack in APP_ENV=testing.
  production-preflight:
    image: taisartownhub-backend:test
    user: www-data
    environment:
      APP_ENV: production
      APP_NAME: "TaisarTownHub API"
      APP_DEBUG: "false"
      APP_KEY: base64:FCkLXSSnmmfbGJwJic1ie3qcv8XYDzm78f9Ax91nIGM=
      APP_URL: https://api.taisartownhub.com
      BCRYPT_ROUNDS: "12"
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      SANCTUM_TOKEN_PREFIX: tth_
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: taisartownhub_test
      DB_USERNAME: taisar
      DB_PASSWORD: test-password
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      SESSION_SECURE_COOKIE: "true"
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: test-redis-password
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      MAIL_FROM_ADDRESS: noreply@taisartownhub.test
      FILE_VAULT_ENCRYPTION: "true"
      CORS_ALLOWED_ORIGINS: https://taisartownhub.com,https://www.taisartownhub.com
      SANCTUM_STATEFUL_DOMAINS: taisartownhub.com,www.taisartownhub.com
      RUN_MIGRATIONS: "false"
      MALWARE_SCAN_ENABLED: "true"
      MALWARE_SCANNER: clamav
      CLAMD_SOCKET: clamav:3310
      MALWARE_SCAN_FAIL_CLOSED: "true"
      MALWARE_SCAN_LOG_SKIPPED: "true"
    volumes:
      - private_vault:/var/www/html/storage/app/private/documents
      - quarantine_storage:/var/www/html/storage/app/private/quarantine
      - public_storage:/var/www/html/storage/app/public
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - taisartownhub-network
    command: ["php", "artisan", "app:production-check", "--strict", "--json"]

  worker:
    image: taisartownhub-backend:test
    environment:
      APP_KEY: base64:FCkLXSSnmmfbGJwJic1ie3qcv8XYDzm78f9Ax91nIGM=
      DB_DATABASE: taisartownhub_test
      DB_PASSWORD: test-password
      REDIS_PASSWORD: test-redis-password
      FLUTTERWAVE_PUBLIC_KEY: FLWPUBK_TEST
      FLUTTERWAVE_SECRET_KEY: FLWSECK_TEST
      FLUTTERWAVE_ENCRYPTION_KEY: FLWENC_TEST
      FLUTTERWAVE_WEBHOOK_SECRET: whsec_test
      MAIL_MAILER: log
      MAIL_HOST: localhost
      MAIL_PORT: 1025
      MAIL_USERNAME: test
      MAIL_PASSWORD: test
      MAIL_FROM_ADDRESS: test@localhost

  scheduler:
    image: taisartownhub-backend:test
    environment:
      APP_KEY: base64:FCkLXSSnmmfbGJwJic1ie3qcv8XYDzm78f9Ax91nIGM=
      DB_DATABASE: taisartownhub_test
      DB_PASSWORD: test-password
      REDIS_PASSWORD: test-redis-password
      MAIL_MAILER: log
      MAIL_HOST: localhost
      MAIL_PORT: 1025
      MAIL_USERNAME: test
      MAIL_PASSWORD: test
      MAIL_FROM_ADDRESS: test@localhost
