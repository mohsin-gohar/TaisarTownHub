# TaisarTownHub — Docker CI
#
# Builds production Docker images, runs container smoke tests,
# and validates healthchecks. Runs on push to main and PRs.
#
# Readiness is checked by scripts/wait-for-compose-ready.sh against an explicit
# list of required services (with a hard deadline and failure logs). No test
# step may start until that gate succeeds.

name: Docker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker-backend:
    name: Build & Test Backend Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: false
          load: true
          tags: taisartownhub-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start infrastructure services
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d mysql redis clamav

      - name: Wait for infrastructure readiness
        # Replaces a fixed `sleep 60`: fails the job if a dependency never
        # becomes healthy, and prints its logs instead of guessing.
        run: bash scripts/wait-for-compose-ready.sh 300 mysql redis clamav

      - name: Run migrations
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml run --rm migrate

      - name: Start backend
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d backend

      - name: Wait for backend readiness
        run: bash scripts/wait-for-compose-ready.sh 180 backend

      - name: Run backend healthcheck
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T backend php scripts/healthcheck.php

      - name: Run backend tests in container
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T backend php artisan test --filter "MapManagement|DocumentShare|Inquiry"

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml ps -a || true
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color --tail=200 || true

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v

  docker-frontend:
    name: Build & Test Frontend Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: false
          load: true
          tags: taisartownhub-frontend:test
          build-args: |
            VITE_API_URL=https://api.taisartownhub.com/api
            VITE_APP_MODE=production
            VITE_STRIPE_PUBLIC_KEY=test
            VITE_SENTRY_DSN=
            VITE_GA_MEASUREMENT_ID=
            VITE_LOGROCKET_APP_ID=
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test frontend build output
        run: |
          docker run --rm taisartownhub-frontend:test ls -la /usr/share/nginx/html/
          docker run --rm taisartownhub-frontend:test test -f /usr/share/nginx/html/index.html

  docker-integration:
    name: Full Stack Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [docker-backend, docker-frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start full stack
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d

      - name: Wait for required services (readiness gate)
        # Checks required services BY NAME, not an arbitrary count of "healthy"
        # lines. Only 4 services shipped healthchecks before this fix, so the
        # old `-ge 6` gate could never pass and the loop silently exited 0
        # after 30 iterations. This gate fails after a defined deadline.
        run: |
          bash scripts/wait-for-compose-ready.sh 420 \
            mysql:healthy redis:healthy clamav:healthy migrate:exited0 \
            backend:healthy frontend:healthy nginx:healthy \
            worker:healthy scheduler:healthy

      - name: Run integration smoke tests
        run: |
          # Every request goes through the real nginx gateway.
          curl -fsS --retry 5 --retry-delay 3 --retry-connrefused http://localhost/api/health | grep -q "healthy"
          curl -fsS --retry 5 --retry-delay 3 --retry-connrefused http://localhost/ | grep -q "TaisarTownHub"
          curl -fsS --retry 5 --retry-delay 3 --retry-connrefused http://localhost/maps | grep -q "TaisarTownHub"
          curl -fsS --retry 5 --retry-delay 3 --retry-connrefused http://localhost/api/agencies | grep -q "success"
          curl -fsS --retry 5 --retry-delay 3 --retry-connrefused http://localhost/api/maps | grep -q "success"

      - name: Run full test suite
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T backend php artisan test --filter "MapManagement|DocumentShare|Inquiry|FeaturedAgency"

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml ps -a || true
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color --tail=200 || true

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
