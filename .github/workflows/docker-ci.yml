# TaisarTownHub — Docker CI
#
# Builds production Docker images, runs container smoke tests,
# and validates healthchecks. Runs on push to main and PRs.

name: Docker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker-backend:
    name: Build & Test Backend Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: false
          load: true
          tags: taisartownhub-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start test stack
        run: |
          docker compose -f docker-compose.yml up -d mysql redis clamav
          sleep 10

      - name: Run migrations
        run: |
          docker compose -f docker-compose.yml run --rm migrate

      - name: Start backend and run healthcheck
        run: |
          docker compose -f docker-compose.yml up -d backend
          sleep 15

      - name: Run backend healthcheck
        run: |
          docker compose -f docker-compose.yml exec -T backend php scripts/healthcheck.php

      - name: Run backend tests in container
        run: |
          docker compose -f docker-compose.yml exec -T backend php artisan test --filter "MapManagement|DocumentShare|Inquiry"

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.yml down -v

  docker-frontend:
    name: Build & Test Frontend Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: false
          load: true
          tags: taisartownhub-frontend:test
          build-args: |
            VITE_API_URL=https://api.taisartownhub.com/api
            VITE_APP_MODE=production
            VITE_STRIPE_PUBLIC_KEY=test
            VITE_SENTRY_DSN=
            VITE_GA_MEASUREMENT_ID=
            VITE_LOGROCKET_APP_ID=
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test frontend build output
        run: |
          docker run --rm taisartownhub-frontend:test ls -la /usr/share/nginx/html/
          docker run --rm taisartownhub-frontend:test test -f /usr/share/nginx/html/index.html

  docker-integration:
    name: Full Stack Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [docker-backend, docker-frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start full stack
        run: |
          docker compose -f docker-compose.yml up -d

      - name: Wait for services
        run: |
          echo "Waiting for services to be healthy..."
          for i in {1..30}; do
            if docker compose ps --format "table {{.Service}}\t{{.Status}}" | grep -q "unhealthy"; then
              echo "Service unhealthy, checking logs..."
              docker compose logs --tail=50
              exit 1
            fi
            if docker compose ps --format "table {{.Service}}\t{{.Status}}" | grep -q "healthy"; then
              healthy_count=$(docker compose ps --format "table {{.Service}}\t{{.Status}}" | grep -c "healthy")
              echo "Healthy services: $healthy_count"
              if [ "$healthy_count" -ge 6 ]; then
                echo "All core services healthy!"
                break
              fi
            fi
            sleep 10
          done

      - name: Run integration smoke tests
        run: |
          # Test backend health endpoint via nginx
          curl -fsS http://localhost/api/health | grep -q "healthy"
          
          # Test frontend loads
          curl -fsS http://localhost/ | grep -q "TaisarTownHub"
          
          # Test maps endpoint
          curl -fsS http://localhost/maps | grep -q "TaisarTownHub"
          
          # Test API endpoint
          curl -fsS http://localhost/api/agencies | grep -q "success"
          
          # Test maps API
          curl -fsS http://localhost/api/maps | grep -q "success"

      - name: Run full test suite
        run: |
          docker compose -f docker-compose.yml exec -T backend php artisan test --filter "MapManagement|DocumentShare|Inquiry|FeaturedAgency"

      - name: Cleanup
        if: always()
        run: docker compose down -v