# TaisarTownHub — Docker CI
#
# Builds production Docker images, runs container smoke tests,
# and validates healthchecks. Runs on push to main and PRs.
#
# PHPUnit tests are intentionally NOT run inside these containers: production
# images are installed with `composer --no-dev`, so `artisan test` (PHPUnit is
# a require-dev dependency) is unavailable. The authoritative backend suite
# runs in ci.yml against MySQL 8. This workflow validates image/runtime health
# and gateway smoke behaviour only.
#
# Readiness is checked by scripts/wait-for-compose-ready.sh against an explicit
# list of required services (with a hard deadline and failure logs). No test
# step may start until that gate succeeds.

name: Docker CI

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # docker-compose.yml declares these with ${VAR:?}. Compose interpolates the
  # base file BEFORE merging docker-compose.ci.yml, so the values must exist in
  # the environment; setting them only at service level in the override is not
  # enough and aborts every `docker compose` command in this workflow.
  APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  DB_ROOT_PASSWORD: test-root-password
  DB_PASSWORD: test-password
  REDIS_PASSWORD: test-redis-password

jobs:
  docker-backend:
    name: Build & Test Backend Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: false
          load: true
          tags: taisartownhub-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start infrastructure services
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d mysql redis clamav

      - name: Wait for infrastructure readiness
        # Replaces a fixed `sleep 60`: fails the job if a dependency never
        # becomes healthy, and prints its logs instead of guessing.
        run: bash scripts/wait-for-compose-ready.sh 300 mysql redis clamav

      - name: Run migrations
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml run --rm migrate

      - name: Start backend
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d backend

      - name: Wait for backend readiness
        run: bash scripts/wait-for-compose-ready.sh 180 backend

      - name: Run backend healthcheck
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T backend php scripts/healthcheck.php

      - name: Verify real antivirus clean and threat verdicts
        # The disposable CI stack has a healthy ClamAV daemon with signatures.
        # This sends actual file bytes over clamd INSTREAM; no production data.
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T backend php scripts/clamav-smoke.php

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml ps -a || true
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color --tail=200 || true

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v

  docker-frontend:
    name: Build & Test Frontend Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: false
          load: true
          tags: taisartownhub-frontend:test
          build-args: |
            VITE_API_URL=https://api.taisartownhub.com/api
            VITE_APP_MODE=production
            VITE_STRIPE_PUBLIC_KEY=test
            VITE_SENTRY_DSN=
            VITE_GA_MEASUREMENT_ID=
            VITE_LOGROCKET_APP_ID=
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test frontend build output
        run: |
          docker run --rm taisartownhub-frontend:test ls -la /usr/share/nginx/html/
          docker run --rm taisartownhub-frontend:test test -f /usr/share/nginx/html/index.html

  backup-restore:
    name: Backup & Restore Drill (MySQL 8)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Workflow-level DB_PASSWORD=test-password belongs to the Compose
    # integration job (app user `taisar`). Laravel's env() reads process
    # environment BEFORE .env, so without this job-level override PHP ignored
    # the generated .env value and connected with the wrong root password
    # (SQLSTATE 1045). Job-level env overrides workflow-level env.
    env:
      DB_USERNAME: root
      DB_PASSWORD: test-root-password
    # Genuine end-to-end backup validation on a disposable MySQL 8 service:
    # migrate -> seed -> private-vault fixture -> backup.sh -> restore-drill.ps1
    # (isolated scratch database + checksum/schema/row/index/FK/vault checks).
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-root-password
          MYSQL_DATABASE: taisartownhub_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysql --protocol=TCP -h 127.0.0.1 -uroot -ptest-root-password -e 'SELECT 1' taisartownhub_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, bcmath, intl, zip, gd
          coverage: none

      - name: Install MySQL 8 client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mysql-client

      - name: Install dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        working-directory: backend
        run: |
          cat > .env <<'ENV'
          APP_NAME=TaisarTownHub
          APP_ENV=testing
          APP_DEBUG=true
          APP_KEY=
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=taisartownhub_ci
          DB_USERNAME=root
          DB_PASSWORD=test-root-password
          CACHE_STORE=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          MAIL_MAILER=log
          ENV
          php artisan key:generate --force

      - name: Wait for MySQL app database (real TCP query)
        # `mysqladmin ping` can succeed against MySQL's init-time socket
        # server BEFORE MYSQL_DATABASE/MYSQL_USER exist. Prove the actual app
        # database is reachable over TCP, the same check used in Compose.
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if mysql --protocol=TCP -h 127.0.0.1 -uroot -ptest-root-password \
                -e 'SELECT 1' taisartownhub_ci >/dev/null 2>&1; then
              echo "MySQL app database ready over TCP after ${i} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "::error title=MySQL app DB not ready::SELECT 1 against taisartownhub_ci over TCP never succeeded"
          exit 1

      - name: Fresh migrations and seed data
        working-directory: backend
        run: |
          set -euo pipefail
          log=/tmp/tth-migrate-seed.log
          trap 'code=$?; if [ "$code" -ne 0 ]; then msg=$(head -c 2600 "$log" | tr "\n" " "); echo "::error title=Migrate/seed failed::$msg"; fi' EXIT
          {
            php artisan migrate --force --no-interaction -vvv
            php artisan db:seed --force --no-interaction -vvv
          } 2>&1 | tee "$log"

      - name: Create private-vault fixture
        run: |
          mkdir -p "backend/storage/app/private/documents/nested"
          printf 'backup drill fixture\n' > "backend/storage/app/private/documents/nested/drill document.txt"

      - name: Run real backup (destination path contains spaces)
        run: bash scripts/backup.sh "/tmp/tth backup dir with spaces"

      - name: Run genuine isolated restore drill
        run: |
          set -euo pipefail
          log=/tmp/tth-restore-drill.log
          trap 'code=$?; if [ "$code" -ne 0 ]; then msg=$(head -c 2600 "$log" | tr "\n" " "); echo "::error title=Restore drill failed::$msg"; fi' EXIT
          pwsh -NoProfile -ExecutionPolicy Bypass \
            -File scripts/restore-drill.ps1 \
            -BackupDir "/tmp/tth backup dir with spaces" \
            -Scratch "/tmp/tth restore drill with spaces" 2>&1 | tee "$log"

      - name: Verify MySQL 8 engine and scratch cleanup
        run: |
          export MYSQL_PWD=test-root-password
          version=$(mysql -h 127.0.0.1 -P 3306 -uroot -N -B -e "SELECT VERSION()")
          echo "MySQL server: $version"
          case "$version" in 8.*) ;; *) echo "expected MySQL 8, got $version" >&2; exit 1;; esac
          leftovers=$(mysql -h 127.0.0.1 -P 3306 -uroot -N -B -e "SELECT COUNT(*) FROM information_schema.SCHEMATA WHERE SCHEMA_NAME LIKE 'tth_restore_drill_%'")
          echo "Leftover drill databases: $leftovers"
          test "$leftovers" = "0"
          test ! -e "/tmp/tth restore drill with spaces"

  docker-integration:
    name: Full Stack Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [docker-backend, docker-frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Images built in the other jobs live on different runners, so they are
      # not available here. Rebuild the same two images with the shared GHA
      # cache and force Compose to reuse them (`--no-build`), instead of letting
      # Compose silently build two more copies during `up`.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (cached)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: false
          load: true
          tags: taisartownhub-backend:test
          cache-from: type=gha

      - name: Build frontend image (cached)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: false
          load: true
          tags: taisartownhub-frontend:test
          build-args: |
            VITE_API_URL=http://127.0.0.1/api
            VITE_APP_MODE=production
            VITE_STRIPE_PUBLIC_KEY=pk_test_ci
            VITE_SENTRY_DSN=
            VITE_GA_MEASUREMENT_ID=
            VITE_LOGROCKET_APP_ID=
          cache-from: type=gha

      - name: Validate nginx configs (CI and production)
        # `docker compose up` would only reveal a broken config as a failed
        # readiness gate after several minutes. Validate BOTH configs first;
        # the production config needs a throwaway self-signed certificate
        # because TLS material is never committed to the repository.
        run: |
          set -euo pipefail
          docker run --rm --add-host frontend:127.0.0.1 \
            -v "$PWD/docker/nginx.ci.conf:/etc/nginx/nginx.ci.conf:ro" \
            nginx:1.30.8-alpine nginx -t -c /etc/nginx/nginx.ci.conf
          mkdir -p nginx/ssl
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -subj "/CN=localhost" \
            -keyout nginx/ssl/privkey.pem -out nginx/ssl/fullchain.pem 2>/dev/null
          docker run --rm --add-host frontend:127.0.0.1 \
            -v "$PWD/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/nginx/ssl:/etc/nginx/ssl:ro" \
            nginx:1.30.8-alpine nginx -t
          # Legacy image configs (root Dockerfile.prod, deprecated but still
          # tracked) had the same invalid CORS block. Validate them too so no
          # shipped config can fail on startup.
          docker run --rm \
            -v "$PWD/docker/backend/nginx.conf:/etc/nginx/nginx.conf:ro" \
            nginx:1.30.8-alpine nginx -t
          docker run --rm --add-host backend:127.0.0.1 \
            -v "$PWD/docker/frontend/nginx.conf:/etc/nginx/nginx.conf:ro" \
            nginx:1.30.8-alpine nginx -t

      - name: Start full stack
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --no-build

      - name: Wait for required services (readiness gate)
        # Checks required services BY NAME, not an arbitrary count of "healthy"
        # lines. Only 4 services shipped healthchecks before this fix, so the
        # old `-ge 6` gate could never pass and the loop silently exited 0
        # after 30 iterations. This gate fails after a defined deadline.
        run: |
          bash scripts/wait-for-compose-ready.sh 420 \
            mysql:healthy redis:healthy clamav:healthy migrate:exited0 \
            backend:healthy frontend:healthy nginx:healthy \
            worker:healthy scheduler:healthy

      - name: Verify two-replica backend operation
        # Scale only the disposable CI stack. No production systems or data
        # are involved. Both replicas must pass their own PHP healthcheck and
        # the nginx gateway must continue serving API traffic after scaling.
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --no-build --scale backend=2 backend
          deadline=$((SECONDS + 180))
          healthy=0
          replicas=()
          while [ "$SECONDS" -lt "$deadline" ]; do
            mapfile -t replicas < <(docker compose -f docker-compose.yml -f docker-compose.ci.yml ps -q backend)
            if [ "${#replicas[@]}" -eq 2 ]; then
              healthy=0
              for id in "${replicas[@]}"; do
                if docker exec "$id" php scripts/healthcheck.php >/dev/null 2>&1; then
                  healthy=$((healthy + 1))
                fi
              done
              if [ "$healthy" -eq 2 ]; then
                echo "both backend replicas are healthy"
                break
              fi
            fi
            sleep 5
          done
          test "${#replicas[@]}" -eq 2
          test "$healthy" -eq 2
          for attempt in $(seq 1 12); do
            BODY=$(curl -fsS --retry 3 --retry-delay 1 --retry-connrefused http://localhost/api/health)
            grep -q "healthy" <<<"$BODY"
          done
          echo "two-replica gateway health requests passed"

      - name: Generate ephemeral demo password for disposable CI data
        run: echo "CI_DEMO_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"

      - name: Seed disposable enterprise data and demo personas
        # The password exists only for this isolated job; the seeder never
        # writes it into production or source control.
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T -e DEMO_STAFF_PASSWORD="$CI_DEMO_PASSWORD" backend php artisan db:seed --force --no-interaction

      - name: Run integration smoke tests
        run: |
          set -euo pipefail
          BASE=http://localhost
          # Every request goes through the real nginx gateway.
          # Capture the body first: piping curl straight into `grep -q` lets
          # grep close the pipe on the first match, which makes curl exit 23
          # (CURLE_WRITE_ERROR) under `set -o pipefail` — a flaky CI failure.
          BODY=$(curl -fsS --retry 5 --retry-delay 3 --retry-connrefused "$BASE/api/health")
          grep -q "healthy" <<<"$BODY"
          BODY=$(curl -fsS --retry 5 --retry-delay 3 --retry-connrefused "$BASE/")
          grep -q "TaisarTownHub" <<<"$BODY"
          BODY=$(curl -fsS --retry 5 --retry-delay 3 --retry-connrefused "$BASE/maps")
          grep -q "TaisarTownHub" <<<"$BODY"
          BODY=$(curl -fsS --retry 5 --retry-delay 3 --retry-connrefused "$BASE/api/agencies")
          grep -q "success" <<<"$BODY"
          BODY=$(curl -fsS --retry 5 --retry-delay 3 --retry-connrefused "$BASE/api/maps")
          grep -q "success" <<<"$BODY"

          # Regression: OPTIONS used to hit add_header inside a server-level
          # `if`, so nginx refused to start. It must now answer 204 with CORS
          # headers from the named preflight location.
          PREFLIGHT_HEADERS=$(curl -sS -D - -o /dev/null -X OPTIONS "$BASE/api/auth/login" \
            -H "Origin: http://localhost" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type")
          grep -qi '^HTTP/1.1 204' <<<"$PREFLIGHT_HEADERS"
          grep -qi '^Access-Control-Allow-Origin: http://localhost' <<<"$PREFLIGHT_HEADERS"

          # Genuine auth flow through nginx -> PHP-FPM -> MySQL -> Redis.
          EMAIL="ci-drill-$(date +%s)@example.test"
          PASSWORD="Ci-Drill-Pass-123"
          REGISTER=$(curl -fsS -X POST "$BASE/api/auth/register" \
            -H "Content-Type: application/json" -H "Accept: application/json" \
            -d "{\"fullName\":\"CI Drill User\",\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\",\"phone\":\"03001234567\",\"cnic\":\"42101-1234567-1\"}")
          grep -q '"success":true' <<<"$REGISTER"
          TOKEN=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])' <<<"$REGISTER")
          test -n "$TOKEN"
          BODY=$(curl -fsS "$BASE/api/auth/me" -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/json")
          grep -q "$EMAIL" <<<"$BODY"
          BODY=$(curl -fsS -X POST "$BASE/api/auth/logout" -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/json")
          grep -q '"success":true' <<<"$BODY"

          LOGIN=$(curl -fsS -X POST "$BASE/api/auth/login" \
            -H "Content-Type: application/json" -H "Accept: application/json" \
            -d "{\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\"}")
          grep -q '"success":true' <<<"$LOGIN"
          TOKEN=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])' <<<"$LOGIN")
          test -n "$TOKEN"
          BODY=$(curl -fsS "$BASE/api/auth/me" -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/json")
          grep -q "$EMAIL" <<<"$BODY"
          echo "integration smoke tests: gateway, preflight, register, login, me, logout all passed"

      - name: Set up Node 24 for API-backed browser role matrix
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install browser test dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium for API-backed browser role matrix
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run API-backed browser role matrix
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1
          PLAYWRIGHT_API_URL: http://127.0.0.1/api
          PLAYWRIGHT_SKIP_WEBSERVER: "true"
          DEMO_STAFF_PASSWORD: ${{ env.CI_DEMO_PASSWORD }}
        run: npx playwright test e2e/role-based.spec.ts --workers=1

      - name: Run disposable 10-worker API load and transaction integrity probe
        working-directory: frontend
        env:
          PROBE_API: http://127.0.0.1/api
          LOAD_TEST_EMAIL: admin@taisartownhub.com
          LOAD_TEST_PASSWORD: ${{ env.CI_DEMO_PASSWORD }}
          LOAD_TEST_ALLOW_MUTATIONS: "true"
          LOAD_COOLDOWN: "65"
        run: npx tsx scripts/load-test.mts 10 10

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml ps -a || true
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color --tail=200 || true

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
