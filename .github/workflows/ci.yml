# CI gates: one authoritative MySQL 8 backend suite, frontend verify, OpenAPI parse.
#
# The old redundant "Backend suite (PHP 8.3)" job had NO MySQL service while
# PHPUnit is configured for MySQL, producing 354 connection-refused failures on
# every push. It is removed; the MySQL integration job is the only backend
# suite. SQLite is never used as a workaround.

name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-mysql:
    name: Backend suite (PHP 8.3, MySQL 8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-only-password
          MYSQL_DATABASE: taisartownhub_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-only-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
        # GitHub Actions service containers do not support `command:`. The
        # lock wait timeout is applied per connection by config/database.php
        # via MYSQL_LOCK_WAIT_TIMEOUT below.
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: taisartownhub_test
      DB_USERNAME: root
      DB_PASSWORD: test-only-password
      DB_ROOT_PASSWORD: test-only-password
      MYSQL_LOCK_WAIT_TIMEOUT: 5
    steps:
      - uses: actions/checkout@v4

      # phpunit.xml + the job-level DB_* variables are authoritative. Keep
      # .env present but empty to avoid phpdotenv warnings on every test.
      - name: Prepare test environment
        run: 'echo "# CI bootstrap: MySQL settings come from the job environment." > .env'

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, bcmath, intl, zip, gd
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Wait for MySQL
        run: php scripts/wait-for-db.php

      - name: Confirm MySQL driver (no SQLite fallback)
        run: php scripts/assert-db-driver.php

      - name: Run full suite against MySQL 8
        run: php artisan test

  frontend:
    name: Frontend verify (Node 24)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify chain (lint, tests, build + prerender, bundle check)
        run: npm run verify

  contract:
    name: OpenAPI spec parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install YAML parser
        run: python3 -m pip install --quiet pyyaml
      - name: Validate YAML syntax
        run: >-
          python3 -c "import yaml; yaml.safe_load(open('docs/openapi.yaml', encoding='utf-8')); print('openapi.yaml YAML OK')"

  browser-ui:
    name: Browser UI regression (Playwright Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # These suites exercise public pages, navigation, maps, responsive
      # layouts, interactive controls and WhatsApp links without requiring
      # production credentials or a live API.
      - name: Run UI-only browser regression suites
        run: >-
          npx playwright test
          e2e/cross-browser-smoke.spec.ts
          e2e/responsive.spec.ts
          e2e/maps.spec.ts
          e2e/interactive-elements.spec.ts
          e2e/whatsapp.spec.ts
          e2e/public-pages.spec.ts
          --workers=1
  browser-cross:
    name: Browser cross-engine regression (Firefox + WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Firefox and WebKit
        run: npx playwright install --with-deps firefox webkit
      - name: Run public cross-engine smoke
        run: npx playwright test --config=playwright.cross-browser.config.ts e2e/cross-browser-smoke.spec.ts
