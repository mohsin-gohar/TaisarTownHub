# G-15 — CI gates: backend feature suite, frontend verify chain, OpenAPI parse.
#
# Mirrors the gates proven locally: `php artisan test` (sqlite :memory:,
# APP_KEY pinned in phpunit.xml) and `npm run verify`
# (lint → tests → build + prerender → bundle check).

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend suite (PHP 8.3)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pdo_sqlite, bcmath, intl, zip, gd
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run feature suite
        run: php artisan test

  integration-mysql:
    name: Backend suite on MySQL 8 (integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-only-password
          MYSQL_DATABASE: taisartownhub_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-only-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: taisartownhub_test
      DB_USERNAME: root
      DB_PASSWORD: test-only-password
      DB_ROOT_PASSWORD: test-only-password
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pdo_sqlite, bcmath, intl, zip, gd
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Wait for MySQL
        run: php scripts/wait-for-db.php

      - name: Confirm MySQL driver (no SQLite fallback)
        run: php scripts/assert-db-driver.php

      - name: Run full suite against MySQL 8
        run: php artisan test

  frontend:
    name: Frontend verify (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify chain (lint, tests, build + prerender, bundle check)
        run: npm run verify

  contract:
    name: OpenAPI spec parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install YAML parser
        run: python3 -m pip install --quiet pyyaml
      - name: Validate YAML syntax
        run: >-
          python3 -c "import yaml; yaml.safe_load(open('docs/openapi.yaml', encoding='utf-8')); print('openapi.yaml YAML OK')"
