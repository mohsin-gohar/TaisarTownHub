; TaisarTownHub production PHP settings.
; Laravel validates uploads up to 25MB (documents) and 10MB (maps); PHP must
; allow the request before validation can run.

upload_max_filesize = 32M
post_max_size = 40M
memory_limit = 256M
max_execution_time = 120
max_input_time = 120
max_input_vars = 3000
expose_php = Off

opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; Never display errors in production responses; log them instead.
display_errors = Off
log_errors = On
